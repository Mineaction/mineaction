<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TNMAC Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1b2a;color:#fff;min-height:100vh;
  display:flex;align-items:center;justify-content:center;}
.login-wrap{width:100%;max-width:400px;padding:1rem;}
.login-card{background:#1a2f4a;border-radius:20px;padding:2.5rem;border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-logo{text-align:center;margin-bottom:2rem;}
.login-logo .flag{font-size:3rem;display:block;margin-bottom:.5rem;}
.login-logo h1{font-size:1.4rem;font-weight:800;color:#fff;}
.login-logo p{font-size:.8rem;color:rgba(255,255,255,.4);margin-top:.3rem;}
.form-group{margin-bottom:1.2rem;}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:.5rem;}
.form-group input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:.85rem 1rem;color:#fff;font-size:.95rem;outline:none;transition:border .2s;}
.form-group input:focus{border-color:#c0392b;}
.btn-login{width:100%;background:#c0392b;color:#fff;border:none;border-radius:12px;padding:1rem;
  font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:.5rem;}
.btn-login:hover{background:#e74c3c;transform:translateY(-2px);box-shadow:0 8px 20px rgba(192,57,43,.4);}
.err{color:#ff6b6b;font-size:.82rem;text-align:center;margin-top:1rem;min-height:1.2em;}
.back-link{text-align:center;margin-top:1.5rem;}
.back-link a{color:rgba(255,255,255,.3);font-size:.8rem;text-decoration:none;transition:color .2s;}
.back-link a:hover{color:#fff;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="flag">🇹🇯</span>
      <h1>TNMAC Admin</h1>
      <p>Tajikistan National Mine Action Centre</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="admin" required autocomplete="username"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button class="btn-login" type="submit" id="loginBtn">Sign In →</button>
      <div class="err" id="err"></div>
    </form>
    <div class="back-link"><a href="/">← Back to website</a></div>
  </div>
</div>
<script>
  if(localStorage.getItem('tnmac_token')) window.location.href='/admin/dashboard.html';
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('err');
    btn.textContent = 'Signing in...'; btn.disabled = true;
    try {
      const r = await fetch('/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username: document.getElementById('username').value,
          password: document.getElementById('password').value })
      });
      const d = await r.json();
      if(!r.ok) throw new Error(d.error || 'Login failed');
      localStorage.setItem('tnmac_token', d.token);
      localStorage.setItem('tnmac_user', d.username);
      window.location.href = '/admin/dashboard.html';
    } catch(ex) {
      err.textContent = ex.message;
      btn.textContent = 'Sign In →'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
